<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Carte GTA 6</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="lib/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="Outils"></nav>
  <main id="zone-carte">
    <div id="map"></div>
    <div id="haut">
      <button id="compteur" class="puce-info">Chargement…</button>
      <div id="bandeaux"></div>
    </div>
    <div id="reticule" hidden></div>
    <div id="coords" hidden></div>
  </main>
  <aside id="panneau" hidden>
    <div class="pan-tete">
      <input id="recherche" type="search" placeholder="🔎 Rechercher (lieu, énoncé)…" autocomplete="off">
      <button id="pan-fermer" class="ico" aria-label="Fermer le panneau">✕</button>
    </div>
    <div class="pan-resume"><span id="resume"></span><button id="reset-filtres" class="btn petit">↺ Réinitialiser les filtres</button></div>
    <div id="onglets"><button data-o="legende">Légende</button><button data-o="filtres">Filtres</button><button data-o="liste">Liste</button></div>
    <div id="pan-corps"></div>
  </aside>
</div>
<section id="feuille" hidden></section>
<div id="modal" hidden></div>
<div id="toast" role="status"></div>
<input type="file" id="fichier-carte" accept="image/*" hidden>
<input type="file" id="fichier-json" accept=".json,application/json" hidden>
<noscript><p style="padding:20px;color:#fff">Cette appli a besoin de JavaScript.</p></noscript>
<script src="lib/leaflet/leaflet.js"></script>
<script src="lib/markercluster/leaflet.markercluster.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
